upstream bookmark_service_upstream {
    server bookmark_service:8080;
}

upstream portal_upstream {
    server portal:3000;
}

server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://portal_upstream/;
    }

    # Handle missing trailing slash by redirecting
    location = /api/bookmark_service {
        return 301 /api/bookmark_service/;
    }
    
    location /api/bookmark_service/ {
        proxy_pass http://bookmark_service_upstream/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
    }
}
