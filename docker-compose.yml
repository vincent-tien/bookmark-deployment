services:
  redis:
    image: redis:alpine
    container_name: bmk-redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
  bookmark_service:
    image: vincenttien/bookmark-service:dev
    container_name: bmk-bookmark-service
    restart: always
    depends_on:
      - redis
      - db
    env_file: ./services/bookmark_service/.env
  portal:
    image: ebvn/bookmark-app-portal:dev
    container_name: bmk-portal
    restart: always
    depends_on:
      - bookmark_service
  nginx:
    image: nginx:alpine
    container_name: bmk-nginx
    depends_on:
      - bookmark_service
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
  db:
    image: postgres:18
    container_name: bmk-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/18
    ports:
      - "5432:5432"